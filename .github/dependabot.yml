version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # No labels: maintainers label by hand. An empty list stops Dependabot
    # applying its default "dependencies" label.
    labels: []

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: []
